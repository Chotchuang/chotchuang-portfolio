name: Verify portfolio

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Cloudflare Pages export
        run: npm run check:pages
